name: Build VozLivre APKs
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Servidor e Cliente (debug)
        run: gradle assembleServerDebug assembleClientDebug
      - name: Upload APK Servidor
        uses: actions/upload-artifact@v4
        with:
          name: VozLivre-Servidor-debug
          path: app-server/build/outputs/apk/debug/VozLivre-Servidor-debug.apk
      - name: Upload APK Cliente
        uses: actions/upload-artifact@v4
        with:
          name: VozLivre-Cliente-debug
          path: app-client/build/outputs/apk/debug/VozLivre-Cliente-debug.apk
