plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}

tasks.register('assembleServerDebug') { dependsOn ':app-server:assembleDebug' }
tasks.register('assembleClientDebug') { dependsOn ':app-client:assembleDebug' }
tasks.register('assembleServerRelease') { dependsOn ':app-server:assembleRelease' }
tasks.register('assembleClientRelease') { dependsOn ':app-client:assembleRelease' }
