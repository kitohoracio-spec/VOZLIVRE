plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vozlivre.server'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vozlivre.server'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '6.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "VozLivre-Servidor-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation project(':core')
}
